services:
  mongo-secure:
    image: mongo:7
    container_name: mongo-secure
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: breezy_app
      MONGO_INITDB_ROOT_PASSWORD: breezypass
      MONGO_INITDB_DATABASE: ma_db
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:



