# Passer de DetectionOnly à On pour bloquer vraiment
SecRuleEngine On

# Logger les requêtes bloquées
SecAuditLog /var/log/modsec_audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditEngine RelevantOnly

# Niveau de paranoïa OWASP CRS (1=permissif, 4=strict)
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1"

# OPTION 2 : Ajouter OPTIONS aux méthodes HTTP autorisées par le CRS OWASP
SecAction \
  "id:900200,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"