limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # =========================
    # AUTH INTERNAL CHECK
    # =========================
    location /auth {
        internal;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;

        proxy_pass http://breezy_app:5000/api/auth/validate;
    }

    # =========================
    # PUBLIC AUTH ROUTES
    # =========================

    location /api/auth/login {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://breezy_app:5000/api/auth/login;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://breezy_app:5000/api/auth/register;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # PROTECTED API ROUTES
    # =========================

# =========================
    # PROTECTED API ROUTES
    # =========================

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # 1. Si c'est un OPTIONS (Preflight CORS), on bypass l'auth_request
        # et on envoie direct au backend pour qu'il applique son `@fastify/cors`
        if ($request_method = 'OPTIONS') {
            proxy_pass http://breezy_app:5000;
        }

        # 2. L'authentification Nginx ne s'applique que sur les vraies requêtes (GET, POST...)
        auth_request /auth;

        proxy_pass http://breezy_app:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # =========================
    # DEFAULT BLOCK
    # =========================

    location / {
        return 404;
    }
}