limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Auth interne - modsecurity off obligatoire :
    # le subrequest hérite du Content-Length du POST original,
    # ce qui déclenche la règle 920170 (GET with body)
    location /auth {
        internal;
        modsecurity off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://breezy_app:5000/api/auth/validate;
    }

    # Routes publiques (pas d'auth_request)
    location /api/auth/login {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://breezy_app:5000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://breezy_app:5000/api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Posts publics - accessibles sans connexion (page d'accueil)
    location = /api/posts {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://breezy_app:5000/api/posts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload fichiers - modsecurity off (multipart/form-data)
    location /api/upload/ {
        auth_request /auth;
        modsecurity off;
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://breezy_app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Routes API protégées
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 1m;

        # Exclusions CRS ciblées :
        # 911100 : PATCH/DELETE bloqués par défaut - nécessaires pour une API REST
        # 934110/934190 : faux positif SSRF sur http://localhost/uploads (nos propres URLs)
        modsecurity_rules '
            SecRuleRemoveById 911100
            SecRuleRemoveById 934110
            SecRuleRemoveById 934190
        ';

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost';
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type';
            add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS,PATCH';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        auth_request /auth;
        proxy_pass http://breezy_app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Swagger UI (documentation API)
    location /docs {
        proxy_pass http://breezy_app:5000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers uploadés (images des posts)
    location /uploads/ {
        proxy_pass http://breezy_app:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
